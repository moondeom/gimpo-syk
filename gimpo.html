<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김포 소지명(小地名) 디지털 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- 헤더 -->
    <header class="bg-slate-900 text-white px-6 py-3.5 flex justify-between items-center shadow-md z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🗺️</span>
            <div>
                <h1 class="font-bold text-lg leading-tight">김포 소지명(小地名) 아카이브</h1>
                <p class="text-xs text-slate-400">김포의 옛 지명, 마을 유래 및 역사 기록 DB</p>
            </div>
        </div>
        
        <div id="authStatus" class="flex items-center space-x-3"></div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
        
        <!-- [좌측] 김포 지도 Canvas & 지역 선택 -->
        <div class="w-full lg:w-5/12 bg-slate-100 border-r border-slate-200 flex flex-col p-4 overflow-y-auto custom-scroll shrink-0">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-map-location-dot text-indigo-600"></i> 김포 관내 읍·면·동 지도
                    </h2>
                    <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-medium">클릭 시 지역 선택</span>
                </div>
                
                <div class="relative w-full aspect-[4/3] bg-slate-800 rounded-lg overflow-hidden shadow-inner">
                    <canvas id="gimpoMapCanvas" class="w-full h-full cursor-pointer"></canvas>
                    <div class="absolute bottom-2 right-2 bg-slate-900/80 backdrop-blur text-white text-[10px] px-2 py-1 rounded border border-slate-700">
                        🔴 거점 위치 | 📍 등록 지명
                    </div>
                </div>

                <div class="mt-3 flex flex-wrap gap-1" id="regionBtnContainer"></div>
            </div>

            <!-- 현황 통계 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
                    <div class="w-9 h-9 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold">
                        <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500">등록된 소지명</div>
                        <div class="text-lg font-bold text-slate-800" id="statTotalCount">0개</div>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
                    <div class="w-9 h-9 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center font-bold">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500">현재 접속 권한</div>
                        <div class="text-xs font-bold text-slate-800" id="statAuthRole">일반 사용자</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [우측] 검색, 카테고리 필터 & 데이터 목록 -->
        <div class="flex-1 bg-white flex flex-col h-full overflow-hidden">
            
            <!-- 상단 조작바 (검색, 필터, 등록 버튼) -->
            <div class="p-4 border-b border-slate-200 bg-white space-y-3 shrink-0">
                <div class="flex flex-col sm:flex-row gap-2 justify-between items-center">
                    <div class="relative w-full sm:w-72">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="renderArchive()" placeholder="지명, 유래, 위치 검색..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button id="addPlaceBtn" onclick="openAddModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-plus"></i> 새 소지명 등록
                        </button>
                    </div>
                </div>

                <!-- 카테고리 탭 -->
                <div class="flex border-b border-slate-200 text-xs font-medium text-slate-500" id="categoryTabs">
                    <button onclick="setCategory('전체')" class="tab-btn px-4 py-2 border-b-2 border-indigo-600 text-indigo-600 font-bold" data-cat="전체">전체 보기</button>
                    <button onclick="setCategory('고개/산')" class="tab-btn px-4 py-2 border-b-2 border-transparent hover:text-slate-700" data-cat="고개/산">⛰️ 고개/산</button>
                    <button onclick="setCategory('들판/천')" class="tab-btn px-4 py-2 border-b-2 border-transparent hover:text-slate-700" data-cat="들판/천">🌾 들판/천</button>
                    <button onclick="setCategory('옛마을')" class="tab-btn px-4 py-2 border-b-2 border-transparent hover:text-slate-700" data-cat="옛마을">🏡 옛마을</button>
                    <button onclick="setCategory('기타')" class="tab-btn px-4 py-2 border-b-2 border-transparent hover:text-slate-700" data-cat="기타">📍 기타</button>
                </div>
            </div>

            <!-- 데이터 카드가 나열되는 영역 -->
            <div class="flex-1 p-4 overflow-y-auto custom-scroll bg-slate-50" id="cardsContainer"></div>
        </div>
    </div>

    <!-- 1. 상세 미리보기 팝업 모달 -->
    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100 max-h-[90vh] overflow-y-auto custom-scroll">
            <button onclick="closePreviewModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="previewContent"></div>
        </div>
    </div>

    <!-- 2. 관리자 로그인 모달 (비밀번호 자동 마스킹) -->
    <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
            <h3 class="text-base font-bold text-slate-800 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-lock text-indigo-600"></i> 관리자 로그인
            </h3>
            <p class="text-xs text-slate-500 mb-4">소지명 등록 및 삭제 권한을 얻으려면 로그인하세요.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">아이디</label>
                    <input type="text" id="loginId" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="loginPw" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-2 mt-5">
                    <button type="button" onclick="closeLoginModal()" class="px-3.5 py-2 bg-slate-100 text-slate-600 text-xs rounded-lg hover:bg-slate-200 font-medium">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-700 font-medium shadow-sm">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. 새 소지명 등록 모달 -->
    <div id="addModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto custom-scroll">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 새 소지명 기록하기
            </h3>
            <form onsubmit="handleAddPlace(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">지명 (한글)</label>
                        <input type="text" id="addName" required placeholder="예: 솔터고개" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">한자/이칭 (선택)</label>
                        <input type="text" id="addHanja" placeholder="예: 松峙" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">행정구역</label>
                        <select id="addRegion" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
                            <option value="구래동">구래동</option>
                            <option value="마산동">마산동</option>
                            <option value="장기동">장기동</option>
                            <option value="운양동">운양동</option>
                            <option value="양촌읍">양촌읍</option>
                            <option value="통진읍">통진읍</option>
                            <option value="대곶면">대곶면</option>
                            <option value="월곶면">월곶면</option>
                            <option value="하성면">하성면</option>
                            <option value="고촌읍">고촌읍</option>
                            <option value="사우동">사우동</option>
                            <option value="풍무동">풍무동</option>
                            <option value="김포본동">김포본동</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">분류</label>
                        <select id="addCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
                            <option value="고개/산">⛰️ 고개/산</option>
                            <option value="들판/천">🌾 들판/천</option>
                            <option value="옛마을">🏡 옛마을</option>
                            <option value="기타">📍 기타</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">상세 위치 설명</label>
                    <input type="text" id="addLocation" placeholder="예: 구래동 솔터마을 3단지 북쪽 산줄기" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">지명 유래 및 전해오는 이야기</label>
                    <textarea id="addStory" rows="3" required placeholder="지명의 명칭 유래나 전설, 옛 주민들의 이야기를 기록하세요." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-5">
                    <button type="button" onclick="closeAddModal()" class="px-3.5 py-2 bg-slate-100 text-slate-600 text-xs rounded-lg hover:bg-slate-200 font-medium">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-700 font-medium shadow-sm">등록 완료</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 초기 기초 데이터 세트
        const initialPlaces = [
            { id: 1, name: "가마지천", hanja: "駕馬池川", region: "구래동", category: "들판/천", location: "구래동 호수공원 및 가마지천 수변공원 일대", story: "옛날 임금이 행차할 때 가마를 타고 지나가다 물을 마시고 쉬어가던 못(池)과 하천이라는 유래에서 이름 붙여졌습니다." },
            { id: 2, name: "솔터고개", hanja: "松峙", region: "구래동", category: "고개/산", location: "구래동 솔터마을 주변 산자락", story: "소나무가 울창하게 우거진 터에 위치한 고개라는 뜻에서 유래했으며, 과거 구래리와 마산리를 이어주던 고갯길입니다." },
            { id: 3, name: "가현산", hanja: "歌弦山", region: "마산동", category: "고개/산", location: "마산동과 인천 서구 경계", story: "산 모양이 거문고를 타는 듯 신선들이 노래를 즐기던 곳이라 하여 붙여진 이름으로, 봄철 진달래 군락지로 유명합니다." },
            { id: 4, name: "문수산", hanja: "文殊山", region: "월곶면", category: "고개/산", location: "월곶면 포내리 문수산성", story: "문수보살의 명칭에서 유래했으며, 병인양요 당시 프랑스군과 격전을 벌인 역사적 호국 산성입니다." },
            { id: 5, name: "대명항 옛구지", hanja: "大明港", region: "대곶면", category: "옛마을", location: "대곶면 대명리 어촌계 일대", story: "조선시대 강화해협을 건너는 배들이 머물던 덕포진 인근 옛 어촌 마을로 포구가 크게 번창하던 곳입니다." },
            { id: 6, name: "덕포진", hanja: "德浦鎭", region: "대곶면", category: "기타", location: "대곶면 신장리 해안", story: "신미양요와 병인양요 당시 손돌목 바다를 지키던 천혜의 조선시대 요새 진지입니다." }
        ];

        // 읍면동 캔버스 좌표 정보
        const regions = {
            "월곶면": { x: 90, y: 70 },
            "하성면": { x: 190, y: 60 },
            "통진읍": { x: 140, y: 120 },
            "대곶면": { x: 70, y: 170 },
            "양촌읍": { x: 130, y: 180 },
            "구래동": { x: 120, y: 220 },
            "마산동": { x: 150, y: 210 },
            "운양동": { x: 210, y: 170 },
            "장기동": { x: 190, y: 210 },
            "김포본동": { x: 230, y: 220 },
            "사우동": { x: 250, y: 250 },
            "풍무동": { x: 260, y: 280 },
            "고촌읍": { x: 290, y: 290 }
        };

        // 데이터 및 세션 상태
        let places = JSON.parse(localStorage.getItem('gimpo_places')) || initialPlaces;
        let isAdmin = localStorage.getItem('gimpo_is_admin') === 'true';
        let currentCategory = '전체';
        let currentRegion = '전체';

        // 1. 초기 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            renderRegionBtns();
            renderArchive();
            drawMap();
        });

        // 2. 인증 관리 (관리자 ID: admin / PW: admin123)
        function updateAuthUI() {
            const authStatus = document.getElementById('authStatus');
            const addPlaceBtn = document.getElementById('addPlaceBtn');
            const statAuthRole = document.getElementById('statAuthRole');

            if (isAdmin) {
                authStatus.innerHTML = `
                    <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-md flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-user-check"></i> 관리자 로그인됨
                    </span>
                    <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md transition">로그아웃</button>
                `;
                addPlaceBtn.classList.remove('hidden');
                statAuthRole.textContent = '🔒 최고 관리자';
                statAuthRole.className = 'text-xs font-bold text-emerald-600';
            } else {
                authStatus.innerHTML = `
                    <button onclick="openLoginModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md font-medium transition shadow-sm">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i> 관리자 로그인
                    </button>
                `;
                addPlaceBtn.classList.add('hidden');
                statAuthRole.textContent = '일반 사용자';
                statAuthRole.className = 'text-xs font-bold text-slate-800';
            }
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value;
            const pw = document.getElementById('loginPw').value;

            if (id === 'admin' && pw === 'admin123') {
                isAdmin = true;
                localStorage.setItem('gimpo_is_admin', 'true');
                updateAuthUI();
                renderArchive();
                closeLoginModal();
                alert('🔑 관리자로 로그인되었습니다.');
            } else {
                alert('❌ 아이디 또는 비밀번호가 올바르지 않습니다.');
            }
        }

        function handleLogout() {
            isAdmin = false;
            localStorage.setItem('gimpo_is_admin', 'false');
            updateAuthUI();
            renderArchive();
            alert('로그아웃되었습니다.');
        }

        // 3. 삭제 처리 (카드 및 미리보기 팝업 모달 어디서나 작동)
        window.deletePlace = function(id, e) {
            if (e) e.stopPropagation(); // 카드 클릭(미리보기 열기)과 이벤트 분리

            if (!isAdmin) {
                alert('🔒 관리자 권한이 필요합니다.');
                return;
            }

            if (confirm('정말로 이 소지명 기록을 삭제하시겠습니까?')) {
                places = places.filter(p => p.id !== id);
                localStorage.setItem('gimpo_places', JSON.stringify(places));
                closePreviewModal();
                renderArchive();
                drawMap();
            }
        };

        // 4. 미리보기 팝업 모달
        window.openPreviewModal = function(id) {
            const place = places.find(p => p.id === id);
            if (!place) return;

            const modalContent = document.getElementById('previewContent');
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-3 pr-6">
                        <div>
                            <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">${place.category}</span>
                            <h2 class="text-xl font-bold text-slate-800 mt-1">${place.name} <span class="text-sm text-slate-400 font-normal">(${place.hanja || '한자미상'})</span></h2>
                            <p class="text-xs text-indigo-600 font-medium mt-0.5"><i class="fa-solid fa-location-dot"></i> ${place.region}</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 mb-1">📍 상세 위치 설명</h4>
                        <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${place.location || '위치 정보가 등록되지 않았습니다.'}</p>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 mb-1">📖 지명 유래 및 설화 이야기</h4>
                        <p class="text-xs text-slate-700 leading-relaxed bg-amber-50/50 p-3 rounded-lg border border-amber-100/60 whitespace-pre-line">${place.story}</p>
                    </div>
                    ${isAdmin ? `
                        <div class="pt-2 flex justify-end">
                            <button onclick="window.deletePlace(${place.id}, event)" class="bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs px-3 py-1.5 rounded-lg font-medium border border-rose-200 transition">
                                <i class="fa-solid fa-trash-can mr-1"></i> 이 기록 삭제
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('previewModal').classList.remove('hidden');
        };

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        // 5. 등록 처리
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        function handleAddPlace(e) {
            e.preventDefault();
            const newPlace = {
                id: Date.now(),
                name: document.getElementById('addName').value,
                hanja: document.getElementById('addHanja').value,
                region: document.getElementById('addRegion').value,
                category: document.getElementById('addCategory').value,
                location: document.getElementById('addLocation').value,
                story: document.getElementById('addStory').value
            };

            places.unshift(newPlace);
            localStorage.setItem('gimpo_places', JSON.stringify(places));
            
            closeAddModal();
            renderArchive();
            drawMap();
            e.target.reset();
            alert('✨ 새 소지명이 성공적으로 등록되었습니다.');
        }

        // 6. 목록 및 카드 렌더링
        function renderArchive() {
            const container = document.getElementById('cardsContainer');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = places.filter(p => {
                const matchCategory = currentCategory === '전체' || p.category === currentCategory;
                const matchRegion = currentRegion === '전체' || p.region === currentRegion;
                const matchSearch = p.name.toLowerCase().includes(searchKeyword) || 
                                    p.story.toLowerCase().includes(searchKeyword) ||
                                    p.region.toLowerCase().includes(searchKeyword);
                return matchCategory && matchRegion && matchSearch;
            });

            document.getElementById('statTotalCount').textContent = `${places.length}개`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-xs">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300"></i>
                        등록되거나 검색된 소지명 데이터가 없습니다.
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">` + 
                filtered.map(p => `
                    <div onclick="openPreviewModal(${p.id})" class="bg-white rounded-xl p-4 border border-slate-200 hover:border-indigo-300 hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600">${p.category}</span>
                                    <h3 class="font-bold text-slate-800 text-sm mt-1 group-hover:text-indigo-600 transition">
                                        ${p.name} <span class="text-xs font-normal text-slate-400">(${p.hanja || '한자미상'})</span>
                                    </h3>
                                </div>
                                <span class="text-xs text-slate-500 font-medium bg-slate-100 px-2 py-0.5 rounded">${p.region}</span>
                            </div>
                            <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-3">${p.story}</p>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-400">
                            <span><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>클릭하여 미리보기</span>
                            ${isAdmin ? `
                                <button onclick="window.deletePlace(${p.id}, event)" class="text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded hover:bg-rose-50 transition">
                                    <i class="fa-solid fa-trash-can mr-1"></i>삭제
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('') + 
            `</div>`;
        }

        // 7. 지역 필터 및 카테고리 세팅
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'tab-btn px-4 py-2 border-b-2 border-indigo-600 text-indigo-600 font-bold';
                } else {
                    btn.className = 'tab-btn px-4 py-2 border-b-2 border-transparent hover:text-slate-700';
                }
            });
            renderArchive();
        }

        function renderRegionBtns() {
            const container = document.getElementById('regionBtnContainer');
            const regionList = ['전체', ...Object.keys(regions)];
            
            container.innerHTML = regionList.map(r => `
                <button onclick="selectRegion('${r}')" class="region-btn text-[11px] px-2 py-1 rounded border ${r === currentRegion ? 'bg-indigo-600 text-white border-indigo-600 font-bold' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                    ${r}
                </button>
            `).join('');
        }

        function selectRegion(r) {
            currentRegion = r;
            renderRegionBtns();
            renderArchive();
            drawMap();
        }

        // 8. 캔버스 김포 지도 시각화
        function drawMap() {
            const canvas = document.getElementById('gimpoMapCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 그리드
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;
            for(let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 노드 및 연결선 그리기
            const scaleX = canvas.width / 340;
            const scaleY = canvas.height / 340;

            Object.entries(regions).forEach(([name, pos]) => {
                const cx = pos.x * scaleX;
                const cy = pos.y * scaleY;
                const isSelected = currentRegion === name;
                const placeCount = places.filter(p => p.region === name).length;

                // 노드 원
                ctx.beginPath();
                ctx.arc(cx, cy, isSelected ? 9 : 6, 0, Math.PI * 2);
                ctx.fillStyle = isSelected ? '#818cf8' : (placeCount > 0 ? '#f43f5e' : '#64748b');
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 텍스트 라벨
                ctx.fillStyle = isSelected ? '#ffffff' : '#cbd5e1';
                ctx.font = isSelected ? 'bold 11px Noto Sans KR' : '10px Noto Sans KR';
                ctx.fillText(`${name}${placeCount > 0 ? `(${placeCount})` : ''}`, cx + 10, cy + 4);
            });
        }

        // 캔버스 클릭 시 해당 지역 선택
        document.getElementById('gimpoMapCanvas').addEventListener('click', (e) => {
            const canvas = document.getElementById('gimpoMapCanvas');
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const scaleX = canvas.width / 340;
            const scaleY = canvas.height / 340;

            Object.entries(regions).forEach(([name, pos]) => {
                const cx = pos.x * scaleX;
                const cy = pos.y * scaleY;
                const dist = Math.hypot(clickX - cx, clickY - cy);
                if (dist < 15) {
                    selectRegion(name);
                }
            });
        });

        window.addEventListener('resize', drawMap);
    </script>
</body>
</html>
